name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'DEPLOY'
          set -e

          REPO_URL="git@github.com:Kevine-fr/FindUrJob.git"

          echo "Preparation du depot..."
          mkdir -p ${{ secrets.PATH_DIR }}
          cd ${{ secrets.PATH_DIR }}

          if [ ! -d .git ]; then
            echo "Premier deploiement : initialisation du depot git..."
            git init -q
            git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi

          echo "Mise a jour du code..."
          git fetch origin --prune
          git reset --hard origin/main

          echo "Calcul de la version..."
          BASE_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || true)
          [ -n "$BASE_VERSION" ] || BASE_VERSION="1.0"
          PATCH=$(git rev-list --count HEAD)
          APP_VERSION="${BASE_VERSION}.${PATCH}"
          APP_COMMIT=$(git rev-parse --short HEAD)
          echo "Version : ${APP_VERSION} (${APP_COMMIT})"

          echo "Generation du .env racine (lu par docker compose)..."

          cat > .env << 'ENVEOF'
          CREDENTIALS_KEY=${{ secrets.CREDENTIALS_KEY }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          APP_URL=${{ secrets.APP_URL }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          ENVEOF

          # Version calculee plus haut : ajoutee hors du heredoc (qui est quote
          # et n'expanserait pas les variables shell).
          {
            echo "APP_VERSION=${APP_VERSION}"
            echo "APP_COMMIT=${APP_COMMIT}"
          } >> .env

          # Le moteur IA lit ses cles dans ai/.env (env_file du compose), pas
          # dans le .env racine. Sans ce fichier il demarre en mode hors-ligne,
          # et France Travail comme Adzuna sont ignorees en silence.
          echo "Generation du ai/.env..."

          cat > ai/.env << 'AIENVEOF'
          AI_PROVIDER=auto
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL=claude-opus-5
          AI_EFFORT=medium

          FRANCE_TRAVAIL_CLIENT_ID=${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET=${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}

          ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY=fr

          LOG_LEVEL=info
          AIENVEOF

          # Le reseau est declare `external` : compose ne le cree pas lui-meme.
          docker network inspect web >/dev/null 2>&1 || docker network create web

          echo "Demarrage des conteneurs..."
          # Un seul build, sur le compose de production. `--no-cache` global
          # retelechargeait Chromium (~1 Go) a chaque deploiement.
          #
          # En cas d'echec, compose n'annonce que « container X is unhealthy »
          # sans dire pourquoi : on sort les journaux avant de rendre la main,
          # faute de quoi il faut rejouer le demarrage a la main sur le VPS
          # pour apprendre ce qui a plante.
          if ! docker compose -f docker-compose.prod.yml up -d --build --remove-orphans; then
            echo "Echec du demarrage. Etat des services :"
            docker compose -f docker-compose.prod.yml ps
            echo "Journaux :"
            docker compose -f docker-compose.prod.yml logs --tail=60 ai bot server web
            exit 1
          fi

          echo "Verification de la sante des services..."
          for i in $(seq 1 30); do
            if docker exec findurjob-api node -e 'fetch("http://127.0.0.1:4000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' 2>/dev/null; then
              echo "API en ligne."
              break
            fi
            [ "$i" = "30" ] && { echo "L'API ne repond pas :"; docker compose -f docker-compose.prod.yml logs --tail=40 server; exit 1; }
            sleep 2
          done

          docker exec nginx nginx -s reload || true

          # Les anciennes images s'accumulent vite avec Chromium dans le lot.
          docker image prune -f >/dev/null 2>&1 || true

          echo "Deploiement termine."
          DEPLOY

      - name: Resume
        run: |
          echo "## Production deployee" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ secrets.APP_DOMAIN }} |" >> $GITHUB_STEP_SUMMARY