name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Publication des images sur Docker Hub.
  #
  # Volontairement independante du deploiement : le VPS construit ses propres
  # images depuis les sources, et faire attendre la mise en production le temps
  # de pousser l image du robot — qui embarque Chromium — la retarderait de
  # plusieurs minutes sans rien y gagner.
  # ---------------------------------------------------------------------
  images:
    name: Publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      # Une image qui echoue ne doit pas emporter les trois autres.
      fail-fast: false
      matrix:
        include:
          - service: server
            context: ./server
            target: ''
          - service: web
            context: ./web
            # Le build statique servi par nginx, pas le serveur Vite.
            target: runtime
          - service: ai
            context: ./ai
            # Sans pytest ni rechargement a chaud.
            target: runtime
          - service: bot
            context: ./bot
            target: ''
    steps:
      # Sans identifiants, on previent et on s arrete la plutot que d echouer :
      # tant que les secrets ne sont pas poses, un push ne doit pas virer au
      # rouge pour une publication qui n est pas encore configuree.
      - name: Identifiants Docker Hub presents ?
        id: creds
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents : publication ignoree."
          fi

      - name: Checkout
        if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          # Historique complet : la version se compte en nombre de commits, et
          # un clone superficiel donnerait toujours le meme numero.
          fetch-depth: 0

      # Exactement le meme calcul que le deploiement : les deux jobs partent du
      # meme commit, l image publiee porte donc la version mise en production.
      - name: Calcul de la version
        if: steps.creds.outputs.ok == 'true'
        id: version
        run: |
          BASE_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || true)
          [ -n "$BASE_VERSION" ] || BASE_VERSION="1.0"
          APP_VERSION="${BASE_VERSION}.$(git rev-list --count HEAD)"
          # Docker Hub n accepte que des minuscules dans un nom de depot.
          PROJECT=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${DOCKERHUB_USERNAME}/${PROJECT}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "Image : ${DOCKERHUB_USERNAME}/${PROJECT}-${{ matrix.service }}:prod-v${APP_VERSION}"

      - name: Connexion a Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx
        if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Construction et publication
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.version.outputs.image }}:prod-v${{ steps.version.outputs.app_version }}
          # Le cache est ce qui rend l operation tenable : l image du robot
          # telecharge Chromium, pres d un gigaoctet, a chaque construction a
          # froid.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # La version voyage aussi dans l image : `docker inspect` suffit alors
          # a savoir ce qu on fait tourner, sans remonter au tag.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            APP_COMMIT=${{ github.sha }}

      # Un job de matrice a son propre resume : une ligne suffit, un tableau
      # sans en-tete ne se rendrait pas.
      - name: Resume
        if: steps.creds.outputs.ok == 'true'
        run: |
          echo "Image publiee : \`${{ steps.version.outputs.image }}:prod-v${{ steps.version.outputs.app_version }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'DEPLOY'
          set -e

          REPO_URL="git@github.com:Kevine-fr/FindUrJob.git"

          echo "Preparation du depot..."
          mkdir -p ${{ secrets.PATH_DIR }}
          cd ${{ secrets.PATH_DIR }}

          if [ ! -d .git ]; then
            echo "Premier deploiement : initialisation du depot git..."
            git init -q
            git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi

          echo "Mise a jour du code..."
          git fetch origin --prune
          git reset --hard origin/main

          # La base vient du fichier VERSION, le dernier nombre du compte de
          # commits : chaque deploiement porte donc une version differente, sans
          # que personne n ait a l incrementer a la main.
          echo "Calcul de la version..."
          BASE_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || true)
          [ -n "$BASE_VERSION" ] || BASE_VERSION="1.0"
          PATCH=$(git rev-list --count HEAD)
          APP_VERSION="${BASE_VERSION}.${PATCH}"
          APP_COMMIT=$(git rev-parse --short HEAD)
          APP_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Version : ${APP_VERSION} (${APP_COMMIT}) - ${APP_BUILT_AT}"

          echo "Generation du .env racine (lu par docker compose)..."

          cat > .env << 'ENVEOF'
          CREDENTIALS_KEY=${{ secrets.CREDENTIALS_KEY }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
          APP_URL=${{ secrets.APP_URL }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
          ENVEOF

          # Version calculee plus haut : ajoutee hors du heredoc (qui est quote
          # et n'expanserait pas les variables shell).
          {
            echo "APP_VERSION=${APP_VERSION}"
            echo "APP_COMMIT=${APP_COMMIT}"
            echo "APP_BUILT_AT=${APP_BUILT_AT}"
          } >> .env

          # Le moteur IA lit ses cles dans ai/.env (env_file du compose), pas
          # dans le .env racine. Sans ce fichier il demarre en mode hors-ligne,
          # et France Travail comme Adzuna sont ignorees en silence.
          echo "Generation du ai/.env..."

          cat > ai/.env << 'AIENVEOF'
          AI_PROVIDER=auto
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL=claude-opus-5
          AI_EFFORT=medium

          FRANCE_TRAVAIL_CLIENT_ID=${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET=${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}

          ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRY=fr

          LOG_LEVEL=info
          AIENVEOF

          # Le reseau est declare `external` : compose ne le cree pas lui-meme.
          docker network inspect web >/dev/null 2>&1 || docker network create web

          echo "Demarrage des conteneurs..."
          # Un seul build, sur le compose de production. `--no-cache` global
          # retelechargeait Chromium (~1 Go) a chaque deploiement.
          #
          # En cas d'echec, compose n'annonce que « container X is unhealthy »
          # sans dire pourquoi : on sort les journaux avant de rendre la main,
          # faute de quoi il faut rejouer le demarrage a la main sur le VPS
          # pour apprendre ce qui a plante.
          if ! docker compose -f docker-compose.prod.yml up -d --build --remove-orphans; then
            echo "Echec du demarrage. Etat des services :"
            docker compose -f docker-compose.prod.yml ps
            echo "Journaux :"
            docker compose -f docker-compose.prod.yml logs --tail=60 ai bot server web
            exit 1
          fi

          echo "Verification de la sante des services..."
          for i in $(seq 1 30); do
            if docker exec findurjob-api node -e 'fetch("http://127.0.0.1:4000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))' 2>/dev/null; then
              echo "API en ligne."
              break
            fi
            [ "$i" = "30" ] && { echo "L'API ne repond pas :"; docker compose -f docker-compose.prod.yml logs --tail=40 server; exit 1; }
            sleep 2
          done

          # La version affichee doit etre celle qu on vient de deployer.
          #
          # Elle traverse une chaine entiere — .env, interpolation compose,
          # variables du conteneur, /api/health — et il a suffi que le compose
          # de production oublie de transmettre APP_VERSION pour qu elle se fige
          # sur celle du package.json pendant des semaines, sans que rien ne le
          # signale. Un deploiement qui n arrive pas a se nommer a rate quelque
          # chose : autant l apprendre ici.
          echo "Verification de la version publiee..."
          VERSION_VUE=$(docker exec findurjob-api node -e 'fetch("http://127.0.0.1:4000/api/health").then(r=>r.json()).then(d=>console.log(d.version)).catch(()=>console.log(""))' 2>/dev/null | tr -d '[:space:]')
          if [ "$VERSION_VUE" != "$APP_VERSION" ]; then
            echo "L'API annonce « ${VERSION_VUE:-rien} » au lieu de « ${APP_VERSION} »."
            echo "APP_VERSION n'atteint pas le conteneur : verifier le .env et docker-compose.prod.yml."
            docker compose -f docker-compose.prod.yml exec -T server env | grep -E '^APP_' || true
            exit 1
          fi
          echo "Version publiee : ${VERSION_VUE}"

          docker exec nginx nginx -s reload || true

          # Les anciennes images s'accumulent vite avec Chromium dans le lot.
          docker image prune -f >/dev/null 2>&1 || true

          echo "Deploiement termine."
          DEPLOY

      - name: Resume
        run: |
          echo "## Production deployee" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ secrets.APP_DOMAIN }} |" >> $GITHUB_STEP_SUMMARY