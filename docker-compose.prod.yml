# Nom du projet Docker : fixé ici pour ne pas dépendre du nom du dossier.
# Il préfixe les images, les réseaux et les volumes (findurjob_mongo_data).
name: findurjob

services:
  mongo:
    image: mongo:7
    container_name: findurjob-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
        - web

  ai:
    build:
      context: ./ai
      # Étage "runtime" : sans pytest ni rechargement à chaud.
      target: runtime
    container_name: findurjob-ai
    restart: unless-stopped
    # Clés et réglages : copier ai/.env.example en ai/.env (ignoré par git).
    # Sans fichier .env, le moteur démarre en mode déterministe hors-ligne.
    env_file:
      - path: ./ai/.env
        required: false
    expose:
      - "8000"
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).status == 200 else 1)',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
        - web

  bot:
    build: ./bot
    container_name: findurjob-bot
    restart: unless-stopped
    # Chromium épuise le /dev/shm par défaut (64 Mo) dès qu'une page est lourde.
    shm_size: '1gb'
    environment:
      - PORT=8100
      - BOT_PROFILE_DIR=/data/profiles
      - DISPLAY=:99
      - VNC_PORT=6080
    volumes:
      # Les sessions des plateformes survivent au conteneur : c'est tout
      # l'intérêt de se connecter une fois plutôt qu'à chaque candidature.
      - bot_profiles:/data/profiles
    # Pas de montage des sources ici, contrairement au compose de développement :
    # le volume anonyme /app/node_modules ne se met jamais à jour une fois créé,
    # et une nouvelle dépendance manquerait silencieusement au démarrage.
    expose:
      - "8100"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:8100/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
        - web

  api:
    build: ./api
    container_name: findurjob-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ai:
        condition: service_healthy
      bot:
        condition: service_healthy
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/findurjob
      - PYTHON_AI_URL=http://ai:8000
      - BOT_URL=http://bot:8100
      # En production, l ecran passe par le proxy du front (websocket compris).
      - BOT_VNC_URL=/vnc
      # Clé de chiffrement du coffre d'identifiants (AES-256-GCM).
      # À définir dans api/.env — sans elle, aucun mot de passe n'est stocké.
      - CREDENTIALS_KEY=${CREDENTIALS_KEY:-}
      # Signature des sessions. Sans elle, aucun compte ne peut être ouvert.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Origines autorisées à porter un cookie de session (application + admin).
      # Obligatoire avec des cookies : le navigateur refuse le joker.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      # Version réellement déployée, écrite par la CI dans le .env racine.
      # Elle manquait ici : la production affichait donc la version du
      # package.json, figée, plutôt que celle du commit déployé.
      - APP_VERSION=${APP_VERSION:-}
      - APP_COMMIT=${APP_COMMIT:-}
      - APP_BUILT_AT=${APP_BUILT_AT:-}
      # Courriels : confirmation d'adresse, mot de passe oublié, alertes.
      # Ces variables manquaient aussi : sans elles, `SMTP_HOST` est vide et le
      # serveur se rabat sur « journaliser le lien » — en production, cela
      # revient à n'envoyer aucun courriel du tout.
      - APP_URL=${APP_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Notifications push du navigateur (Web Push). Sans ces clés, le canal est
      # annoncé comme indisponible et seul le courriel part.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - NODE_ENV=production
    expose:
      - "4000"
    # `npm start` (node) et non `npm run dev` (nodemon) : en production, rien ne
    # doit surveiller les fichiers ni redémarrer le processus tout seul.
    command: npm start
    networks:
        - web

  web:
    build:
      context: ./web
      # Étage "runtime" : le build statique servi par nginx. Le serveur Vite
      # refuse les noms d'hôte qu'il ne connaît pas — c'est lui qui rejetait le
      # domaine du VPS. Il n'a de toute façon pas sa place en production.
      target: runtime
    container_name: findurjob-web
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "5173"
    # Ni montage de sources ni `command` : l'image contient le site compilé.
    networks:
        - web


networks:
  web:
    external: true

volumes:
  mongo_data:
  bot_profiles:
