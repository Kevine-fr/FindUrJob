<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>FindUrJob — Copilote de candidatures</title>
    <meta
      name="description"
      content="Agrège les offres, recible ton CV par annonce et suit tes candidatures."
    />

    <!-- Icônes : le SVG pour les navigateurs récents, le PNG pour iOS. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installation sur l'écran d'accueil -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="FindUrJob" />
    <meta name="apple-mobile-web-app-title" content="FindUrJob" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Couleur de la barre système, accordée au thème clair ou sombre. -->
    <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101116" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
