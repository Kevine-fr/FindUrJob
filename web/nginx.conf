# `Connection: upgrade` ne doit être envoyé que pour une vraie négociation
# websocket. Le même bloc /vnc/ sert aussi des fichiers ordinaires (vnc.html,
# scripts) : cette table renvoie « close » pour eux, « upgrade » pour le reste.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Service du front compilé, en production.
#
# En développement, c'est Vite qui sert les fichiers ET relaie /api vers l'API.
# Ici, le serveur de dev n'existe plus : nginx reprend les deux rôles, pour que
# le contrat d'URL reste identique (le proxy en amont n'a rien à changer).

server {
  # Même port qu'en développement : le reverse-proxy du VPS pointe déjà dessus.
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression : le bundle JS fait ~230 ko, ~74 ko une fois compressé.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Les fichiers de `assets/` portent une empreinte dans leur nom : leur contenu
  # ne change jamais sous une même URL, on peut donc les garder indéfiniment.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Le service worker ne doit jamais être servi depuis un cache : sinon une
  # ancienne version continue de piloter le site et la mise à jour n'arrive
  # jamais chez les gens qui ont déjà installé l'application.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # `.webmanifest` n'est pas dans les types MIME livrés avec nginx : sans ça il
  # part en application/octet-stream et le navigateur ignore le manifeste,
  # donc l'application n'est pas proposée à l'installation.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location /api/ {
    # nginx resout les noms d'hote des `proxy_pass` littéraux une seule fois, au
    # démarrage : il refuse de démarrer si `server` n'est pas encore là, et
    # garde une IP périmée si le conteneur redémarre. Passer par une variable
    # force une résolution à chaque requête, via le DNS interne de Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:4000;
    # Avec une variable, nginx n'ajoute plus l'URI : on la repasse en entier.
    proxy_pass $api_upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un export PDF passe par Chromium, et une recherche interroge plusieurs
    # plateformes : ces requêtes durent bien plus qu'une requête d'API ordinaire.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Le document de CV envoyé à l'impression embarque ses styles et sa photo.
    # Avec la limite par défaut (1 Mo), l'export échouerait en 413.
    client_max_body_size 12m;
  }

  # Écran du navigateur piloté (reprise en main d'une connexion). noVNC parle
  # websocket : sans les en-têtes d'Upgrade, la fenêtre reste noire.
  location /vnc/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vnc_upstream http://bot:6080;
    rewrite ^/vnc/(.*)$ /$1 break;
    proxy_pass $vnc_upstream;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # Une session de connexion manuelle dure le temps qu'il faut.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Application à page unique : toute route inconnue est rendue par React,
  # sinon un rechargement sur /mon-cv renverrait un 404 d'nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
