<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="findJOBS">
  <title>findJOBS</title>

  <!-- Pastille de marque : le navy du logo. -->
  <rect width="512" height="512" rx="116" fill="#2c3a50"/>

  <!-- Loupe : l'anneau et son manche. Le haut de l'anneau passe sous le
       casque, qui le recouvre — d'où le tracé complet, plus simple qu'un arc
       partiel et sans jointure visible. -->
  <circle cx="256" cy="252" r="94" fill="none" stroke="#f7c548" stroke-width="40"/>
  <path d="M256 352v76" fill="none" stroke="#f7c548" stroke-width="44" stroke-linecap="round"/>

  <!-- Casque de chantier : dôme plein et bord large. Une silhouette pleine
       reste lisible à 16 px, là où un contour se refermerait. -->
  <path d="M176 232a80 80 0 0 1 160 0z" fill="#f7c548"/>
  <rect x="140" y="222" width="232" height="36" rx="18" fill="#f7c548"/>

  <!-- Ferrure du casque : reprend le navy du fond plutôt qu'une troisième couleur. -->
  <circle cx="256" cy="192" r="26" fill="#2c3a50"/>
</svg>
