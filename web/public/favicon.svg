<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FindUrJob">
  <title>FindUrJob</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b73ff"/>
      <stop offset="1" stop-color="#2039c8"/>
    </linearGradient>
  </defs>

  <!-- Pastille de marque : le bleu électrique du produit. -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Mallette : « emploi », lisible dès 16 px parce qu'elle reste une
       silhouette pleine sans détail intérieur fin. -->
  <path d="M198 158v-14a30 30 0 0 1 30-30h56a30 30 0 0 1 30 30v14"
        fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round"/>
  <rect x="86" y="158" width="340" height="240" rx="40" fill="#fff"/>

  <!-- Coche : la candidature partie. Reprend le bleu du fond pour ne pas
       ajouter une troisième couleur. -->
  <path d="M196 282l44 44 84-92" fill="none" stroke="#2039c8" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
